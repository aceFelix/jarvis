[project]
name = "jarvis-agent"
version = "2.0.8"
description = "J.A.R.V.I.S. — 你的钢铁侠同款 AI 助手。可对话、可操作电脑、可后台常驻、能听会说，支持 50+ 内置工具、MCP 生态接入、多模型动态切换。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "zai-sdk>=0.2.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    # pyautogui 跨平台（Windows/macOS/Linux）
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    # pywinauto 仅 Windows（UI 元素级操作，非必需）
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    # pygetwindow 跨平台，Linux 上支持有限
    "pygetwindow>=0.0.9; sys_platform != 'linux'",
]
browser = [
    "playwright>=1.40.0",
]
mcp = [
    "mcp>=1.0.0",
]
camera = [
    # 摄像头工具：OpenCV VideoCapture 读帧
    "opencv-python>=4.8.0",
]
vision = [
    # 实时视觉监控：mediapipe 手势/人脸检测（CPU 实时）+ OpenCV
    "mediapipe>=0.10.14",
    "opencv-python>=4.8.0",
    # OCR 可选
    "paddleocr>=2.7.0",
]
voice = [
    # 阿里 CosyVoice TTS / Paraformer STT SDK（跨平台）
    "dashscope>=1.20.0",
    # 音频播放/录音（跨平台，Linux 需 portaudio19-dev，macOS 需 brew install portaudio）
    "pyaudio>=0.2.14",
    # 实时双工语音回声消除（WebRTC AEC3，消除扬声器回声防 AI 自言自语）
    "aec-audio-processing>=1.0.0",
    # AEC 重采样依赖
    "numpy>=1.24.0",
]
daemon = [
    # 桌面入口与全局热键（原系统托盘已随新 GUI 工作台计划下线，pystray 已移除）
    # pywin32：Windows 日历源（win32com）与桌面快捷方式能力需要
    "pywin32>=227; sys_platform == 'win32'",
    # 全局热键（Windows/Linux 需要 root，macOS 需辅助功能权限）
    "keyboard>=0.13.0; sys_platform != 'darwin'",
    "pillow>=10.0.0",
    # 主动感知：系统资源监控（跨平台）
    "psutil>=5.9.0",
]
realtime_ui = [
    # 实时双工语音对话独立窗口（HTML5 Canvas 方舟反应炉动画）
    # Windows 上需要 Edge WebView2 Runtime（Win10/11 通常已预装）
    "pywebview>=5.0",
]
wechat = [
    # 微信 ClawBot 接入（iLink Bot API HTTP 客户端）
    "aiohttp>=3.9.0",
    # 终端二维码渲染（与 /connect-phone 共用）
    "qrcode>=7.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
# 一键安装全功能（不含 dev 测试工具）
# 用法: pip install "jarvis-agent[all]"
all = [
    "jarvis-agent[gui]",
    "jarvis-agent[browser]",
    "jarvis-agent[mcp]",
    "jarvis-agent[camera]",
    "jarvis-agent[vision]",
    "jarvis-agent[voice]",
    "jarvis-agent[daemon]",
    "jarvis-agent[realtime_ui]",
    "jarvis-agent[wechat]",
]

[project.scripts]
jarvis = "agent.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent" = ["configs/*.toml", "configs/*.yaml", "ui/realtime_window/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
