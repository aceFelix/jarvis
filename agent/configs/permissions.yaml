# 权限规则配置
# 格式: pattern = "ToolName(spec)"  value = allow/deny/ask  source = enterprise/user/project/session
#
# spec 支持 fnmatch 通配符；文件类工具的 spec 是路径 glob，自动做
# ~ 展开、工作目录相对化、平台大小写归一：
#   Bash(git *)          -> 匹配以 git 开头的命令
#   FileRead(~/docs/**)  -> 匹配家目录下 docs 内任意深度文件
#   FileWrite(~/reports/**) -> 限定作用域的写免确认
#
# 放宽语义（W1 策略引擎已并入本管线）：带 spec 的 allow 规则命中可放宽
# 工具默认 ASK/特判 ASK（含 FileWrite/MCP 类），也可放宽"写工作目录外"
# 的路径守护软提醒（spec 覆盖目标即显式白名单，如 FileWrite(~/reports/**)）；
# 裸工具名 allow（如 "Bash"）只能兜底放宽管线默认 ASK，不能放开工具
# 特判 ASK 与跨边界软提醒——免确认要有明确的免确认范围。
# 仍永不可放宽：DENY（硬编码危险规则/路径守护拦截）。限时免确认用
# /lease（只签工作目录内），人不在场用 /away。
#
# 优先级: enterprise > user > project > session（同优先级 deny > ask > allow）
# 注意: 硬编码的危险规则（rm -rf /、写 ~/.ssh 等）永远生效，无法被这里覆盖。

rules:
  # ---- 允许的只读 git 命令 ----
  - pattern: "Bash(git status)"
    value: allow
    source: user
  - pattern: "Bash(git diff)"
    value: allow
    source: user
  - pattern: "Bash(git log)"
    value: allow
    source: user
  - pattern: "Bash(git show)"
    value: allow
    source: user

  # ---- 允许常见只读命令（也可不写，shell_classifier 会自动放行）----
  - pattern: "Bash(ls)"
    value: allow
    source: user
  - pattern: "Bash(cat)"
    value: allow
    source: user
  - pattern: "Bash(pwd)"
    value: allow
    source: user

  # ---- 项目内文件读写允许 ----
  - pattern: "Read(*)"
    value: allow
    source: project
  - pattern: "Glob(*)"
    value: allow
    source: project
  - pattern: "Grep(*)"
    value: allow
    source: project

  # ---- 危险操作强制询问 ----
  - pattern: "Bash(git push*)"
    value: ask
    source: user
  - pattern: "Bash(npm publish*)"
    value: ask
    source: user
  - pattern: "Bash(pip install*)"
    value: ask
    source: user

  # ---- 敏感目录写拒绝（与硬编码规则重复，这里显式声明便于理解）----
  - pattern: "Write(~/.ssh/**)"
    value: deny
    source: enterprise
  - pattern: "Write(~/.aws/**)"
    value: deny
    source: enterprise

  # ---- GUI 工具（阶段二新增）----
  # 说明: GUI 工具走工具特判，默认一律 ASK（操作电脑该有的边界）。
  # 现在带 spec 的 allow 规则可放宽特判 ASK（如 "MouseClick(*)"），
  # 按需自行收紧；裸工具名 allow 不放宽。强制拒绝仍用 deny（压过一切）:
  # - pattern: "WindowClose(*)"
  #   value: deny
  #   source: user
  # - pattern: "KeyTap(alt+f4)"
  #   value: deny
  #   source: user

  # ---- 浏览器工具（阶段二新增）----
  # 说明: 同 GUI 工具，走工具特判:
  #   - 只读工具 (BrowserScreenshot/BrowserGetText/BrowserClose) 自动放行
  #   - 写类工具 (BrowserNavigate/BrowserClick/BrowserType) 一律 ASK
  # 如需对特定域名放行 Navigate（如内网），可加 allow 规则:
  # - pattern: "BrowserNavigate(https://intranet.*)"
  #   value: allow
  #   source: project
