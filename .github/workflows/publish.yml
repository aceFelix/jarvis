name: Publish

# 自动发布工作流：推送 v* tag → 跑测试 → 构建 wheel/sdist → 发布 PyPI + npm + GitHub Release
#
# 触发：git tag v2.0.5 && git push github v2.0.5
# 凭证：
#   - PyPI: Trusted Publisher (OIDC 无凭证)，需在 PyPI Account settings → Publishing 配置
#   - npm: NPM_TOKEN (Automation 类型)，存于 GitHub Secrets
#
# @author aceFelix

on:
  push:
    tags:
      - 'v*'  # 推送 v2.0.5 / v2.1.0 等 tag 自动触发

permissions:
  contents: write  # 创建 GitHub Release 需要
  id-token: write   # PyPI Trusted Publisher OIDC 必需

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: 测试 — 发布前必须确保版本质量
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Syntax check
        run: python -m compileall -q agent/

      - name: Run tests
        run: pytest tests/ -v --tb=short -k "not test_bring_up_reuses_running_proc"

  # ─────────────────────────────────────────────────────────────
  # Job 2: 构建 Python 包（wheel + sdist）
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag matches pyproject.toml version
        run: |
          # 从 tag 名提取版本号（去掉 v 前缀）
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # 从 pyproject.toml 读取版本
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:   $TAG_VERSION"
          echo "Pyproject ver: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch — tag ($TAG_VERSION) ≠ pyproject.toml ($PYPROJECT_VERSION)"
            echo "::error::请先更新 pyproject.toml 和 npm/package.json 到 $TAG_VERSION，提交后再打 tag"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify dist contents
        run: |
          ls -lh dist/
          # 基本完整性检查
          python -c "import zipfile, glob; [zipfile.ZipFile(f).testzip() for f in glob.glob('dist/*.whl')]"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3: 发布到 PyPI（Trusted Publisher，无 API Token）
  # ─────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # Trusted Publisher 必须指定 environment
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publisher 模式下无需 password，OIDC 自动鉴权
          # 前置条件：在 PyPI Account settings → Publishing 添加 pending publisher
          #   Owner: aceFelix, Repo: jarvis, Workflow: publish.yml, Environment: pypi
          print-hash: true  # 打印包哈希便于审计

  # ─────────────────────────────────────────────────────────────
  # Job 4: 发布到 npm（npm 包仅是 wrapper，调 pip 装 Python 包）
  # ─────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          NPM_VERSION=$(node -p "require('./npm/package.json').version")
          echo "Tag version:  $TAG_VERSION"
          echo "npm version:  $NPM_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Version mismatch — tag ($TAG_VERSION) ≠ npm/package.json ($NPM_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        working-directory: ./npm
        run: |
          # 配置 npm token（来自 GitHub Secret）
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Job 5: 创建 GitHub Release（附带 wheel/sdist 下载）
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉全部历史，便于生成 changelog

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog from commits
        id: changelog
        run: |
          # 获取上一个 tag 作为 changelog 起点
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # 没有 previous tag，取全部历史
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Commit range: $RANGE"
          # 生成 markdown 格式 commit 列表
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $RANGE 2>/dev/null || echo "(无 commit 信息)")
          # 多行输出写入 GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 安装

            ```bash
            # PyPI
            pip install "jarvis-agent[all]" --upgrade

            # npm
            npm install -g jarvis-agent
            ```

            ## 变更记录

            ${{ env.CHANGELOG }}

            ## 校验

            发布产物哈希请见 Actions 日志中的 `print-hash` 输出。
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: false
