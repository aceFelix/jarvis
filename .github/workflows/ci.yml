name: CI

# T-05: GitHub Actions CI — push/PR 时自动跑测试 + 语法检查
#
# 触发条件: push 到 main/master 或 PR
# 测试矩阵: Python 3.11 / 3.12 / 3.13 / 3.14
# 步骤: 安装依赖 → 语法检查 → pytest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Syntax check (core modules)
        run: |
          # 编译检查 agent 包全部模块（含新增文件，无需维护硬编码列表）
          python -m compileall -q agent/

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Install smoke (entry point + packaged rule file)
        # 从干净临时目录跑，确保 import 到的是 pip 装进 site-packages 的那份（而非仓库
        # 源码树），证明"装出来的包"入口能起、且随包带上了运行时规则库 cleaners.toml——
        # 这类"漏打包"缺陷源码树里的单测永远测不到。
        run: |
          cd "$(mktemp -d)"
          jarvis --help > /dev/null
          python -c "import agent, pathlib; p = pathlib.Path(agent.__file__).parent / 'config' / 'cleaners.toml'; assert p.is_file(), 'cleaners.toml 未随包安装'; print('install-smoke OK', agent.__version__)"

      - name: Test summary
        if: always()
        run: |
          echo "✅ CI 完成 — 见上方 pytest 输出"
