# jarvis 配置文件（示例模板）
# 复制为 configs/settings.toml 并修改为你自己的配置。
# 项目级配置。会被 ~/.jarvis/settings.toml 和环境变量覆盖。
# 所有字段都可以省略（用默认值）。

# ---- 模型（LLM）----
# 模型域配置已拆分到同层 models.example.toml（复制为 configs/models.toml 使用）：
#   provider / api_format / model / last_model / base_url / api_key / max_tokens /
#   temperature / thinking_budget / enable_thinking / vendor_fallback 等顶层键，
#   以及 [llm.models]（可选模型列表）与 [llm.custom_models.*]（自定义模型）。
# 未拆分前写在 settings.toml 里的模型键仍会被加载（向后兼容）。

# ---- 运行时 ----
# workdir: 贾维斯默认工作目录。开发/文件操作/项目管理都在此目录下进行。
# 可通过 --workdir 命令行参数临时覆盖。
workdir = "./workspace"
# permission_mode: default / plan / accept_edits / yolo
permission_mode = "default"
max_iterations = 50

# ---- 权限规则文件 ----
# permissions_file = "configs/permissions.yaml"

# ---- 系统提示追加 ----
# system_prompt_append = ""

# ---- 调试 ----
debug = false
verbose = false

# ---- 语音 ----
# 基于 DashScope。复用 DASHSCOPE_API_KEY。
# TTS: CosyVoice，音色 longanlang_v3；可用模型 cosyvoice-v3-flash(快)/v3-plus(好)/v3.5-plus(字级时间戳)
# STT: 单一后端 QwenASR（qwen3-asr-flash-realtime，服务端 VAD）
[tts]
model = "cosyvoice-v3-flash"
voice = "longanlang_v3"
volume = 50          # 0-100
speech_rate = 1.0    # 0.5-2.0，1.0 正常语速
pitch_rate = 1.0     # 0.5-2.0，1.0 正常音调
# 自定义音色（/tts-voice 添加，也可手写）：model = 适配模型（家族前缀 cosyvoice-v3
# 或具体模型；声音复刻填创建时的 target_model；空串 = 不限）。切换音色时若 model
# 与上方 model 不兼容会自动联动改模型并落盘。
# [tts.custom_voices."我的声音"]
# name = "我的声音"
# voice_id = "my-clone-xxxx"
# model = "cosyvoice-v3-flash"
# description = "声音复刻 - 我的声音"
# vendor = "dashscope"

[stt]
# 单一后端 QwenASR（OmniRealtimeConversation，服务端 VAD，中英混合强）。
# model 原样透传给 DashScope，需填 qwen 实时识别模型名；填 paraformer / fun-asr 之类会在建连阶段报错。
model = "qwen3-asr-flash-realtime"
max_seconds = 15         # 单次录音最长秒数（防卡死，客户端兜底超时）
silence_seconds = 1.5    # 服务端 VAD 连续静音多少秒视为说完

[voice]
# barge_in: 语音打断——播报中开口说话自动打断。
# 默认关闭——watcher 开第二个 PyAudio 实例，与 TTS 的 PyAudio 并发在 Windows 上会 segfault。
barge_in = false
# barge_in_key: 键盘打断——播报中按 ESC 立即停止播报，切回聆听。
# 默认启用，不占 PyAudio，无崩溃风险，daemon 无窗口也能全局捕获。想换键改 voice_loop.py _KeyBargeInWatcher 默认 key。
barge_in_key = true

# ── 三张词表（不写 = 用内置默认词表，老配置零影响）──
# 词表解析与匹配见 agent/voice/wake_words.py。
#
# wake_words: 待机时怎么称呼它、能把它叫醒。
#   除字面匹配外还参与**拼音同音**匹配——只配「贾维斯」，ASR 听成
#   「加维思」「贾伟斯」「假维斯」「佳维丝」也能叫醒（都折成 jiaweisi）。
#   拼音层只对 ≥3 个汉字的词生效（两字词如「贾维」会命中「甲维集团」，故只走字面）。
#   同时会作为 ASR 热词下发，让识别模型一开始就倾向于输出这个词。
#   第一项还会显示在待机提示横幅里。
#   拼音容错依赖 pypinyin（pip install "jarvis-agent[voice]" 已含）；没装则只做字面匹配。
# wake_words = ["贾维斯", "Jarvis"]
# exit_words = ["退下", "拜拜"]        # 让它退下/待机
# interrupt_words = ["闭嘴", "停"]     # 播报期间打断（需 barge_in = true）

[realtime_talk]
# /talk 实时双工语音（DashScope qwen-audio-3.0-realtime-flash）。
# model / voice / ws_url 也可写在此表内，优先级高于同名顶层 realtime_* 字段。
#
# api_key → 映射到 settings.dashscope_api_key（**语音专用** Key）。它同时被
# /voice（TTS+STT）使用，不只 /talk。三种写法等价，写哪一处都行：
#   1. 本表 api_key
#   2. models.toml 顶层 dashscope_api_key（/init 引导写的就是这里）
#   3. 环境变量 DASHSCOPE_API_KEY
# api_key = "sk-your-bailian-key"
#
# 注：语音固定走阿里云百炼，与 LLM 厂商无关；LLM 用 DeepSeek/OpenAI 时必须单独配
# 这个 Key，否则“能打字但不会说话”。主 LLM 就是百炼时会自动复用它的 key（这一条
# 不需要写在配置里）。解析优先级见 agent/config/voice_key.py。
#
# event_log: 事件时间线日志——把本次会话收到的每条服务端事件按序写入
# ~/.jarvis/logs/diag.log（component=realtime），用于复盘交互时序（谁在何时打断谁）。
# 默认关闭。被服务端判为非有效轮次的语音（🔇 前缀）与退出诊断摘要始终显示，不受此开关控制。
event_log = false
# echo_suppress_with_aec: AI 说话期间是否压低麦克风增益（×0.1）抑制残余回声。
# 默认 true，AEC 已启用时同样生效：WebRTC AEC3 在免提外放下只能消除部分回声，
# 残留会被服务端重新识别为用户语音→触发打断→取消本轮回复，表现为“AI 永远不开口”。
# 仅在佩戴耳机（无扬声器回声）时才建议关闭，让插话语音保持正常增益。
echo_suppress_with_aec = true
# half_duplex: 半双工（默认 true）——AI 说话期间不上传麦克风，说完后留 0.6s 回声尾迹
# 静默期再恢复拾取，是免提外放能连续多轮的关键（否则回声会让 AI 永远不开下一轮）。
# 戴耳机想随口打断时设为 false（全双工）；桌面壳全双工路径不受此键影响。
half_duplex = true
# rescue: 响应救援（默认 true）——用户轮次已提交但服务端迟迟不创建响应、或响应被
# turn_detected 取消后不再补答时，客户端在 1.2~1.8s 后补发一次 response.create
# （官方允许"等待用户下一轮输入时"手动触发），兜底防"贾维斯永远不回复"。
rescue = true
# turn_detection: 轮次检测（默认 "server_vad"，官方免提推荐）——声学 VAD + 静音时长
# 判停，尾音延长当前轮而非触发新轮次。"smart_turn" 语义判停偏早，尾音易被重检为
# 新轮次取消响应，仅建议安静环境/耳机。
turn_detection = "server_vad"
# silence_ms: server_vad 判停静音时长（毫秒，200~6000，默认 500；对话场景推荐 400~800）。
silence_ms = 500
# tools_mode: 语音会话工具模式（默认 "builtin"）——只注册 get_current_time /
# end_conversation，低延迟优先。"all" 装配 ToolRegistry + MCP 全量（约 300 个 schema，
# 会话启动慢，且实测大工具表可能拖慢服务端响应触发）。
tools_mode = "builtin"

[ui]
# 启动动画：JARVIS 蓝色方舟反应炉粒子动效（致敬 钢铁侠）。
# 终端太窄/太矮/非 TTY 时自动跳过。也可用 --no-boot 或 JARVIS_BOOT_ANIMATION=0 关闭。
# 注：REPL 渲染宽度封顶 120 列（_CappedConsole），最大化启动后缩窗不会折行错乱。
# 若喜欢 100 列以内的紧凑布局属预期表现，不是 bug。
boot_animation = true

[context]
# 上下文压缩：总 token 超窗口比例时自动摘要旧消息，保留最近几条原消息。
# 防止 token 爆炸 + 撞模型上下文窗口。
# 也可用 /compact 命令手动触发，JARVIS_CONTEXT_COMPACTION=0 关闭。
compaction = true
context_window = 128000        # 模型上下文窗口（token），换模型时同步修改；不配置默认 128000，勿设 0
compact_ratio = 0.5            # 总量超窗口 50% 才压缩，未超比例绝不压缩
tool_result_keep_recent = 4    # 工具结果折叠时保留最近 N 条完整输出（其余缩成一行摘要）

[memory]
# 记忆持久化：会话存盘/恢复 + 长期记忆注入 system prompt。
# /save /load /sessions 管理会话；/memory 查看长期记忆文件。
# 长期记忆: ~/.jarvis/MEMORY.md（用户级）+ <workdir>/.jarvis/MEMORY.md（项目级）
auto_resume_session = true     # 启动时自动恢复最近会话（退出时自动保存到 auto-latest）
long_term_memory = true         # 启动时加载长期记忆注入 system prompt

# ── 画像记忆（长期记忆 Phase 1a）──
# 会话结束后自动用 LLM 提炼"关于用户的持久事实"（偏好/习惯/背景），
# 存 ~/.jarvis/memory/profile.json，下次会话限额注入 system prompt。
# 后台异步 + 10 分钟节流，不影响对话响应速度。
profile_enabled = true
profile_max_entries = 200            # 条目上限（超出按置信度×新近度淘汰）
profile_inject_token_limit = 300     # 注入 system prompt 的 token 硬限额
profile_refine_min_messages = 6      # 会话至少几条消息才触发提炼

# 独立提炼模型（可选）：用便宜模型跑后台提炼，留空 = 用主 LLM。
# 示例（DashScope qwen-flash，也可配 deepseek 等任意 OpenAI 兼容端点）：
# [memory.refine]
# model = "qwen-flash"
# provider = "dashscope"             # api_format（openai/dashscope/deepseek...）
# base_url = ""                      # 留空用该 provider 默认地址
# api_key = ""                       # 留空复用主 api_key

[skills]
# Skill 系统：加载技能包注入 system prompt。
# 目录: ~/.jarvis/skills/<name>/SKILL.md（用户级）+ <workdir>/.jarvis/skills/<name>/SKILL.md（项目级）
# SKILL.md 含 frontmatter（name/description/when_to_use/trigger_words）+ Markdown 指令正文
# /skills 命令列出已加载技能包
enable = true

[mcp]
# MCP 接入：连接 ~/.jarvis/mcp.json 配置的 MCP server，注册其工具进 ToolRegistry。
# 工具名格式 mcp__<server>__<tool>，默认 ASK 权限（外部进程，yolo 可放宽）。
# 依赖: pip install mcp（未安装时优雅跳过）。/mcp 命令查看连接状态。
enable = true

[profile_bridge]
# 知识图谱画像桥（P2 画像双向同步）：启动时经 MCP 拉取 aceFelix 知识图谱画像
# 注入 system prompt（图谱为唯一事实源）；/memory sync 可把本地画像回写图谱。
# 前提：~/.jarvis/mcp.json 已配置 server（默认名 acefelix-knowledge）。
enabled = false
# server = "acefelix-knowledge"   # mcp.json 中的图谱 server 名（默认值）
# token_limit = 400               # 图谱画像段注入 token 限额（默认值）

[cli_anything]
# CLI-Anything harness 市场配置（可选）。
# 市场加载顺序：market_url 远程 → CLI-Anything 官方 GitHub → market_local 本地回退。
# market_url: 自定义市场的 GitHub raw 前缀，
#   如 https://raw.githubusercontent.com/user/jarvis-harness-market/main
# market_local: 本地市场仓库路径，绝对路径或相对于 jarvis 项目目录。
market_url = ""
market_local = ""

[email]
# 邮件发送（SendEmail 工具）。enabled=false 时工具直接返回错误。
# smtp_password 通常填邮箱授权码（如 163/QQ），不是登录密码。
enabled = false
smtp_host = "smtp.163.com"
smtp_port = 465
# smtp_user = "your_163_email@163.com"      # 发件邮箱账号
# smtp_password = "your_authorization_code" # 邮箱授权码
# sender = "your_163_email@163.com"         # 发件人显示地址（默认与 smtp_user 相同）
# default_recipient = "your_163_email@163.com" # 默认收件人（用户未指定 to 时使用）
# 收件（W2 mail 事件源 + EmailBox 工具）：IMAP 只读，两处共用同一套凭据。
# 事件源（需同时开 [percept].mail_enabled）只取信封头 FROM/SUBJECT/DATE/MESSAGE-ID，
# 永不拉正文，长连接 IDLE，断线自动降级为轮询；
# EmailBox 工具（读/查/回）由用户或模型显式触发，读正文走 BODY.PEEK，读完仍是未读。
# imap_password 留空则复用 smtp_password（163/QQ 两边同一个授权码）。
# imap_host 留空则按 smtp_host 推断（smtp.163.com -> imap.163.com；自定义域名推不出，必须显式写）。
# imap_host = "imap.163.com"
# imap_port = 993                           # 993=SSL；143 走 STARTTLS
# imap_user = "your_163_email@163.com"      # 留空则用 smtp_user
# imap_password = "your_authorization_code"
# imap_mailbox = "INBOX"                    # 只监这一个文件夹，不改邮件状态

[lsp]
# LSP 代码智能
# 安装: pip install python-lsp-server（Python）| npm install -g typescript-language-server（JS/TS）
# 未配置/server 不可用时静默跳过
enable = true
[lsp.servers.python]
command = "python-lsp-server"
args = []
extensions = ["py"]

[daemon]
# 桌面入口与全局热键（原常驻托盘已下线，热键/自启保留给 JARVIS 对话窗口使用）。
# 开机自启: 运行 `jarvis --talk` 的快捷方式放入 shell:startup 文件夹。
# 依赖: pip install keyboard（仅 keyboard 库方案需要；Windows 默认走 RegisterHotKey）。
hotkey = "ctrl+shift+j"        # 全局热键（keyboard 库格式，如 "ctrl+shift+j"）
hotkey_native = true            # Windows 优先使用 RegisterHotKey（比 keyboard 库更快）
hotkey_debounce_ms = 200        # 热键去抖毫秒，防双击触发
# P2-3 每日简报：每天定时播报今日概览（提醒/节假日/系统状态/截止日期/日程）
briefing_enabled = true
briefing_time = "08:30"         # 简报时间（HH:MM）

[bridge]
# P3-1 跨设备协同：手机通过 PWA 网页与电脑端 JARVIS 对话。
# 启动方式：终端输入 /connect-phone；桌面端（jarvis-desktop）点输入栏
# 「跨设备协同」下拉按钮选「手机」（二维码内联显示在中间聊天区）。终端会显示二维码和访问地址。
# 手机和电脑需在同一局域网，或通过内网穿透从外网访问。
# 权限隔离：手机端默认 PLAN 模式（只读），写操作需手机端确认。
# 共享会话：桌面/手机/微信（/connect-wechat）共用同一对话，抢引擎唯一 query 锁串行，
# 都能发消息但绝不同时发。
http_port = 8765               # HTTP 端口（PWA 页面 + 图片上传）
ws_port = 8766                 # WebSocket 端口（实时通信）
token = ""                     # 认证 token，留空则自动生成（每次 /connect-phone 变化）

[monitor]
# 系统资源监控：CPU/内存/磁盘超阈值时通知+语音告警。
# 依赖: pip install psutil。未装时监控静默不可用，不影响其他功能。
enabled = true
cpu_threshold = 85.0       # CPU 使用率 %，超过持续 30s 告警
memory_threshold = 90.0    # 内存使用率 %
disk_threshold = 10.0      # 磁盘剩余 %，低于此值告警
check_interval = 10        # 检查间隔（秒）
alert_cooldown = 600       # 同类告警冷却（秒，10分钟内不重复）
# P2-3 增强
disk_trend_days = 7        # 磁盘趋势预测：预测几天后将满时提前告警
high_cpu_duration = 600    # 异常进程：CPU > 50% 持续多少秒通知用户
work_break_interval = 7200 # 工作时长：连续工作多少秒提醒休息（2小时）

[deadline]
# 截止日期追踪（P2-3）：注册 deadline，分级提醒（7/3/1/0 天 + 逾期每天）。
# 用户对贾维斯说"下周五之前交报告"→ agent 调 AddDeadline 工具注册。
# 每天 check_time 检查所有活跃截止日期，命中提醒天数则播报。
enabled = true
check_time = "09:00"       # 每日检查截止日期的时间

[calendar]
# 日历集成（P2-3）：读取 Outlook/ICS 日历事件，在简报中展示 + 提前提醒。
# backend: auto=优先Outlook回退ICS / outlook=仅Outlook COM / ics=仅ICS文件
# ics_path: 本地 .ics 文件路径（从任意日历应用导出）
# ics_url: 远程 .ics 订阅 URL（Google Calendar/Nextcloud 等）
enabled = false
backend = "auto"
ics_path = ""
ics_url = ""
remind_minutes_before = 30 # 事件前多少分钟提醒

[sandbox]
# 安全沙箱（P3-8）：高风险操作在隔离环境中运行，防止误操作破坏系统。
# 基于 Windows Job Object 限制进程资源（内存/CPU/进程数）。
# 开启后，中等风险命令自动在沙箱内执行（无需用户确认）；
# 高风险命令强制沙箱 + 文件快照保护；极高风险仍需用户确认。
enabled = false
max_memory_mb = 512        # 沙箱内最大内存（MB）
max_cpu_seconds = 60       # 沙箱内最大 CPU 时间（秒）
max_processes = 10         # 沙箱内最大子进程数（防 fork bomb）
timeout = 120              # 沙箱命令总超时（秒）
block_network = false      # 是否阻断沙箱内网络访问
auto_allow_medium = true   # 沙箱开启时自动放行中等风险命令
audit = true               # 记录沙箱审计日志（~/.jarvis/sandbox_audit.jsonl）
max_snapshots = 20         # 文件快照最大保留数
excluded_commands = []     # 不走沙箱的命令（如 ["docker", "wsl"]）

[policy.notify_budget]
# W1 打扰预算（阶段 8）：主动播报“该不该现在打扰你”的确定性闸门（代码见 agent/core/policy/budget.py）。
# 裁决结果与积压队列全部落在 ~/.jarvis/notify_state.json（count / pending / last_emit / last_flush），
# 它是“为什么这条没出声”的唯一可核对证据。
# 闸门顺序是定的：①积压冲刷 → ④重要度门槛 → ②静默时段 → ③同源聚合窗口 → ⑤日预算。
# 顺序上看两点：低分事件在上一步就被抑制了，不会半夜排队等补播；而补播不占 daily_max。
# @author aceFelix
enabled = true             # 总开关（false = 提醒不经预算直接播）
daily_max = 10             # **每日**主动播报上限（超出是“入库待补播”，不是丢）
quiet_hours = "23:00-07:00"  # 静默时段（支持跨午夜；空串=不启用）：提醒类按下方
                           # reminder_channels 走**降级投递**（只上屏不朗读、不入队不占额度）；
                           # 未配已实现通道时，其余播报才是入库待补播
aggregate_window_s = 300   # 同源事件聚合窗口（秒）：窗口内同 key 只播一次，其余合并计数；
                           # 它同时也是冲刷冷却（多久允许补播一次），测日预算时先置 0 免得被聚合掉
min_salience = 0.3         # 重要度门槛（评分=来源权重×时效紧迫度×相关性×历史接受率）；
                           # 低于此值**直接抑制**（只留痕、不入队、不补播）
# 静默时段/额度用尽时，**用户自设提醒**的送达通道（简报与感知事件不受本项影响，
# 它们仍按原口径入库待补播）。默认只降级不延后：气泡与系统通知照投、TTS 不朗读。
# 写成空列表 [] = 退回“入库等补播”（冲刷靠下一条通知触发，夜里没动静就可能久等）。
# “sms” 是留位：尚未接短信服务商，配了会警告并忽略，不会假装已发。
reminder_channels = ["screen"]   # 可多选："screen" 上屏不出声 / "email" 另发一封邮件
quiet_email_to = ""             # email 通道的收件人；留空 = 用 [email].default_recipient

[percept]
# W2 感知层（阶段 9）：统一事件总线 + 逐源采集（代码见 agent/core/percept/）。
# 隐私口径：总开关与逐源开关**全部默认关**，未显式打开的源一个字节都不采；
# 事件只本地落盘（~/.jarvis/percept/events.jsonl），不随对话上传，
# 采了什么可用 bus.export() 一键导出自查。
# 总线只裁事件噪声（去重/节流/故障隔离）；"该不该现在打扰"仍由
# [policy.notify_budget] 决定（两道闸门分工，见 docs/architecture/17-W2感知层.md）。
enabled = false            # 感知层总开关（关=不起轮询线程、不采任何源）
dedup_window_s = 300       # 同一件事的去重窗口（秒）
min_salience = 0.0         # 总线地板分（0=不裁，重要度裁决交给 W1）
history_max = 200          # 内存环形历史条数（留痕文件上限=此值×10 行）
log_events = true          # 本地留痕；false = 完全不碰磁盘
auto_disable_after_errors = 3   # 单源连续失败达此数自动停用（0=只隔离不罢工）

# 前台窗口源：唯一有明显隐私属性的源，默认只留「进程名 + 标题前 40 字」
window_enabled = false
window_interval_s = 5      # 采样间隔（秒）
window_title_max_chars = 40   # 0 = 只报应用名、丢弃标题
window_title_full_enabled = false   # true = 显式同意保留完整标题（仍剥凭据片段）
window_exclude_apps = []   # 留空则用内置敏感应用名单（密码/凭据管理类）；填写则整体覆盖
window_linger_minutes = 0  # >0 才发「在同一应用待太久」提醒

# 文件守望源：只订阅白名单目录（空列表 = 开了也不采）
file_enabled = false
file_watch_dirs = []       # 如 ["E:/Downloads", "~/Desktop"]；自动跳过 .git/node_modules 等机器目录
file_interval_s = 30
file_max_entries = 2000    # 单目录快照条目上限（超出只记 truncated）
file_grow_threshold = 5    # 新增达此数才聚合为一条「目录堆积」提醒
file_ignore_suffixes = []  # 额外忽略后缀（如 [".blend1"]）
file_min_interval_s = 0    # 总线对 file 源的同源投递最小间隔（0=只靠去重窗口）

# 仓库源与邮件源（已实现；CI 构建结果本期未做，理由见 docs/architecture/17-W2感知层.md §6.4）
vcs_enabled = false
vcs_repos = []             # 登记的仓库路径（如 ["E:/2.MyProjects/MyAgentChat/J.A.R.V.I.S/jarvis"]）
vcs_interval_s = 120
vcs_min_interval_s = 60    # 总线对 vcs 源的同源投递最小间隔
mail_enabled = false       # IMAP IDLE 只读，只取信封头不拉正文（凭据配在 [email] 的 imap_*）
mail_min_interval_s = 0    # 0 = 靠 IDLE 推送，不额外节流
mail_watch_senders = []    # 发件人白名单（子串、不分大小写），如 ["boss@", "妈妈"]；非空=只报命中的人
# 收编型源（阶段 11 已接）：底层能力在 agent/core/daemon/ 里早就写好，这里只是把它接到总线上
calendar_enabled = false   # 日程临近：每条日程只报一次；后端与提前量取上方 [calendar] 段（backend/ics_*/remind_minutes_before）
system_enabled = false     # CPU/内存/磁盘阈值告警：阈值取 [monitor] 那一组，不在这里另设（避免两份真相）
schedule_enabled = false   # 留位未接入：提醒已由提醒通道过 W1 闸门播报，再进总线会重复播报

# 视觉在场源（第 4 步已接）：唯一会碰摄像头的源，默认关；需 pip install "jarvis-agent[vision]"
# 人脸进/出画面 = 在场事实（只记账不播报，但用来推断 away）；手势 = 高先验事件（可比赞/踩）
vision_enabled = false
vision_camera_index = 0    # 摄像头索引（0=前置）
vision_fps = 2             # 帧率：常驻成本按它线性增长，在场判断 2fps 已够
vision_gesture_enabled = true       # false = 只做在场检测，不跑手势识别（更省 CPU）
vision_auto_stop_minutes = 0        # >0 空闲自动关摄像头（更省隐私，代价：关闭期间检测不到“回来了”）
vision_interval_s = 5               # 总线排空本源的节拍（秒）

[actions]
# W3.2 副作用账本（阶段 10）：把工具调用记成"可执行的补偿计划"，
# 代码见 agent/core/actions/journal.py，用户面命令 /undo。
# 账本存 ~/.jarvis/actions.jsonl（事件流追加写；含收件人等敏感字段，只落本机）。
# 口径：外发类不可逆动作（SendEmail 等）确认后再进延时窗口，到点才真执行；
# 本地破坏性写入照常执行，但引用本轮 shadow git 检查点，/undo 可整轮回退。
# 提醒一句：延时窗口只"延后"执行，不豁免权限判定与 W1 闸门。
# @author aceFelix
journal_enabled = true     # 总开关（false = 不记账也不延时，/undo 无从下手）
undo_window_s = 30         # 不可逆动作延时窗口（秒）；0 = 不拦、直接执行
track_local_writes = true  # 是否给本地破坏性写入记一条可回滚条目
irreversible_tools = []    # 应急口子：确实要多保护的工具才填（拿只读工具演示窗口是错的测法）
hold_blocks_equivalent = true  # 待发窗口未结案时，网络外发类命令不再自动放行（改问人）

[tasks]
# W3.1 任务脊柱（阶段 10）：跨会话/跨天的目标台账 + 条件等待 + 断点续跑，
# 代码见 agent/core/tasks/spine.py；台账存 ~/.jarvis/goals/<id>.json（一个目标一份）。
# 默认关：驱动器会自主调 LLM 花钱并自己动手执行，必须用户显式授权（同 W2 口径）。
# 推进由 Subagent 在后台跑，结果经 W1 打扰预算闸门播报，不抢桌面会话的 query 锁。
# @author aceFelix
enabled = false            # 驱动器总开关（false = 只读台账，不自动推进）
blocked_ask_days = 3       # 阻塞超此天数主动问一次（走 W1 预算闸门）
step_max_attempts = 3      # 单步失败重试上限
retry_backoff_s = 60       # 重试退避间隔（秒）；本期固定间隔，不按失败次数翻倍
wait_deadline_hours = 72   # 条件等待最长时限（超时转 blocked_timeout 来问，绝不静默挂起）
                           # 只对 file_exists / percept_event 兜底；time 类自带确定时刻，不补 deadline
checkpoint_max = 8         # 后台每推一步先打一个 shadow git 检查点（改动可回退）；
                           # 该配额与 [checkpoint].max_per_session 分族计数，不会把 /rewind 的消息级回退挤没

[maintenance]
# 系统维护层（阶段 12）：清理 / 查毒 / 性能诊断。
# 代码见 agent/core/maintenance/（rules / scanner / cleaner / psrun / defender / health），
# 工具 DiskReport / DiskClean / SystemHealth，命令 /disk /clean /health。
# 清理总开关默认关：这是整个子系统里唯一会主动移动用户文件的部分。
# 关着时 /disk 与 /health 只读能力照常可用，只有 /clean 报「未启用」。
# 清理走隔离区（移动到 ~/.jarvis/quarantine/<批次>/）而不是复制式快照：
#   GB 级的垃圾复制一份等于先把磁盘占满，所以 /clean --restore 才是撤销入口，
#   不是走 W3 账本的 /undo（两套记录，别混）。
# @author aceFelix
enabled = false            # 清理总开关（false = 只读可看，不清）
rules_file = ""             # 自定义规则库路径；留空用内置 agent/config/cleaners.toml
quarantine_days = 7        # 隔离区保留天数，到期自动清（0 = 永不自动清）
scan_max_dir_gb = 50       # 单条规则的体积上限，超过停止累加（防某个巨型目录卡死扫描）
scan_timeout = 120         # 扫描总超时（秒），到点如实标注「已截断」而不是假装扫完
report_min_mb = 100        # 只读报告的最低展示阈值（MB）；体积小于它的目录不占版面
auto_clean_max_risk = "low"  # 允许自动执行的最高风险档 low/medium/high
allow_full_scan = false    # 是否允许 Defender 全盘扫描（默认只给快速扫描，全盘可能跑几小时）

# ── 无人值守自动清理 ─────────────────────────────────────────────────
# 只动 cleaners.toml 里标了 auto_ok = true 的规则（当前仅 crash_dumps /
# wer_reports 两条——删了永远察觉不到的垃圾）。
#
# 为什么不看 auto_clean_max_risk：risk 衡量「删了会怎样」，而这里要问的是
# 「删了用户会不会发现」。risk=low 里混着 recycle_bin（用户刚删的文件就在
# 里面）和 user_temp（可能正被程序占用），把它们当自动许可等于拿风险等级
# 顶替意愿。auto_ok 是逐条人工评估后的独立许可，默认 false。
#
# 生效前提：enabled = true（总闸）。任一开关关闭都安静跳过，不刷日志。
auto_clean_enabled = true    # 自动清理子闸（总闸开启后才有意义）
auto_clean_time = "04:30"    # 每日自动清理时间（HH:MM），错开画像维护的 03:30
auto_clean_min_mb = 20     # 低于此可回收量就不建批次（零感知垃圾常只有几 MB）
auto_clean_notify_mb = 200 # 清出超过这个量才提示一句；低于它全静默
